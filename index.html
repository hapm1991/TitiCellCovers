<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Covers TiTi Cell</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="logo.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f8fafc" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --azul:#2563eb; --azul-suave:#eff6ff; --verde:#16a34a; --verde-suave:#f0fdf4;
  --rojo:#dc2626; --bg:#f8fafc; --card:#ffffff; --texto:#0f172a; --texto-suave:#64748b;
  --borde:#e2e8f0;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--texto);}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:10;}
header .volver{background:none;border:none;font-size:22px;color:var(--azul);padding:0 4px;}
header h1{font-size:17px;margin:0;flex:1;}
header .config{background:none;border:none;font-size:20px;color:var(--texto-suave);}
main{flex:1;padding:16px;padding-bottom:90px;}
nav.tabs{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--borde);padding:6px 0 max(6px,env(safe-area-inset-bottom));}
nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--texto-suave);font-size:11px;padding:4px 0;}
nav.tabs button.activo{color:var(--azul);}
nav.tabs .icono{font-size:20px;}

input[type=text],input[type=email],input[type=password],input[type=search]{
  width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--borde);background:#fff;font-size:15px;color:var(--texto);
}
label{font-size:13px;color:var(--texto-suave);display:block;margin:10px 0 4px;}

.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;}
.btn-azul{background:var(--azul);color:#fff;}
.btn-linea{background:#fff;border:1px solid var(--borde);color:var(--texto);}
.btn-peligro{background:none;border:none;color:var(--rojo);font-size:13px;}
.btn-texto{background:none;border:none;color:var(--azul);font-size:14px;font-weight:600;}

.tarjeta{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--borde);}
.tarjeta-titulo{font-weight:700;font-size:20px;margin-bottom:2px;}
.tarjeta-sub{color:var(--texto-suave);font-size:13px;}

.card-accion{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:14px;flex:1;text-align:left;}
.card-accion .icono{font-size:22px;color:var(--azul);margin-bottom:6px;display:block;}
.card-accion strong{display:block;font-size:14px;margin-bottom:2px;}
.card-accion span.desc{font-size:12px;color:var(--texto-suave);}

.fila{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--borde);}
.fila:last-child{border-bottom:none;}
.fila .chevron{color:#cbd5e1;font-size:18px;}
.fila-info{flex:1;min-width:0;}
.fila-nombre{font-weight:600;font-size:15px;}
.fila-code{color:var(--texto-suave);font-size:12px;}

.avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-mini{width:30px;height:30px;font-size:12px;border-radius:9px;}

.grid-marcas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0;}
.grid-marcas .marca-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;}
.grid-marcas .marca-item span{font-size:12px;color:var(--texto);}

.badge-verde{display:inline-flex;align-items:center;gap:6px;background:var(--verde-suave);color:var(--verde);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;}
.badge-gris{background:#f1f5f9;color:var(--texto-suave);padding:4px 10px;border-radius:8px;font-size:12px;}

.tabs-secundarias{display:flex;gap:8px;margin-bottom:12px;}
.tabs-secundarias button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--borde);background:#fff;color:var(--texto-suave);font-size:14px;font-weight:600;}
.tabs-secundarias button.activo{background:var(--azul);color:#fff;border-color:var(--azul);}

.grupo-modelos{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;}
.grupo-modelo-chip{background:var(--azul-suave);border-radius:12px;padding:10px;min-width:120px;text-align:center;}
.grupo-modelo-chip .avatar{margin:0 auto 6px;}
.grupo-modelo-chip .nombre{font-size:12px;font-weight:600;}
.grupo-modelo-chip .code{font-size:11px;color:var(--texto-suave);}

.fab{position:fixed;bottom:90px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--azul);color:#fff;font-size:26px;border:none;box-shadow:0 4px 14px rgba(37,99,235,.4);z-index:5;}

.fondo-modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.modal h2{margin-top:0;font-size:18px;}
.fila-modal{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;}
.fila-agregar{display:flex;gap:8px;margin-top:6px;}
.fila-agregar input{flex:1;}

.oculto{display:none !important;}
.centro{text-align:center;}
.error{color:var(--rojo);font-size:14px;margin-top:8px;}
.cargando{color:var(--texto-suave);font-size:13px;text-align:center;padding:20px;}
.vacio{color:var(--texto-suave);font-size:14px;text-align:center;padding:30px 10px;}
.consejo{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;color:#92400e;margin-top:16px;}
</style>
</head>
<body>

<div id="pantallaLogin" class="centro" style="padding:60px 24px;max-width:420px;margin:0 auto;">
  <img src="logo.png" style="width:96px;border-radius:18px;" />
  <h2>Covers TiTi Cell</h2>
  <label>Correo</label>
  <input id="loginEmail" type="email" placeholder="tucorreo@ejemplo.com" />
  <label>Contraseña</label>
  <input id="loginPass" type="password" placeholder="••••••••" />
  <button class="btn btn-azul" style="width:100%;margin-top:16px;" onclick="iniciarSesion()">Iniciar sesión</button>
  <p id="loginError" class="error"></p>
</div>

<div id="app" class="oculto">
  <header>
    <button id="btnVolver" class="volver oculto" onclick="volver()">‹</button>
    <h1 id="tituloHeader">Compatibilidad de Covers</h1>
    <button id="btnConfig" class="config" onclick="navegar('config')">⚙️</button>
  </header>
  <main id="main"></main>
  <button id="fabNuevo" class="fab oculto" onclick="abrirModalVincular()">+</button>
  <nav class="tabs">
    <button data-tab="home" onclick="irTab('home')"><span class="icono">🏠</span>Inicio</button>
    <button data-tab="marcas" onclick="irTab('marcas')"><span class="icono">📱</span>Marcas</button>
    <button data-tab="grupos" onclick="irTab('grupos')"><span class="icono">🗂️</span>Grupos</button>
    <button data-tab="favoritos" onclick="irTab('favoritos')"><span class="icono">♡</span>Favoritos</button>
  </nav>
</div>

<div id="modalNuevo" class="fondo-modal oculto">
  <div class="modal">
    <h2 id="tituloModalVincular">Vincular modelos compatibles</h2>
    <p style="font-size:13px;color:var(--texto-suave);">Di qué modelo es igual a cuál — si alguno ya tiene otros modelos ligados, se agrupan todos automáticamente.</p>

    <div id="bloqueModeloA">
      <label>Marca</label>
      <select id="vincularMarcaA" class="select-marca" onchange="onCambioMarca('vincularMarcaA')"></select>
      <input id="vincularMarcaA_nueva" class="oculto" placeholder="Nombre de la marca nueva" style="margin-top:6px;" />
      <label>Modelo</label>
      <input id="vincularModeloA" placeholder="Ej: A04" />
    </div>

    <div style="text-align:center;color:var(--texto-suave);font-size:13px;margin:10px 0;">es igual a</div>

    <label>Marca</label>
    <select id="vincularMarcaB" class="select-marca" onchange="onCambioMarca('vincularMarcaB')"></select>
    <input id="vincularMarcaB_nueva" class="oculto" placeholder="Nombre de la marca nueva" style="margin-top:6px;" />
    <label>Modelo</label>
    <input id="vincularModeloB" placeholder="Ej: A05" />

    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">
      <button class="btn btn-linea" onclick="cerrarModalVincular()">Cancelar</button>
      <button class="btn btn-azul" onclick="confirmarVincular()">Vincular</button>
    </div>
  </div>
</div>

<script>
// =======================================================================
// Configuración de Supabase
// =======================================================================
const SUPABASE_URL = "https://jlixinvggjyixsdoyvri.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsaXhpbnZnZ2p5aXhzZG95dnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTgwOTksImV4cCI6MjEwNTI3NDA5OX0.W_1GGPHstxFFUwgt868CmOf5xSL0-aUCRPHe-MFapKU";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let grupos = [];
let logosMap = {};       // marca_slug -> url
let favoritos = new Set(JSON.parse(localStorage.getItem("favoritosCovers") || "[]"));
let navStack = [{ v: "home" }];
let telefonosTemp = [];

const PALETA = ["#2563eb","#7c3aed","#0891b2","#16a34a","#ea580c","#db2777","#4f46e5","#0d9488"];

// ---------- utilidades ----------
function slug(marca){ return marca.trim().toLowerCase().replace(/\s+/g,"-"); }
function iniciales(marca){ return marca.trim().slice(0,2).toUpperCase(); }
function colorFor(marca){
  let h = 0;
  for (const c of marca) h = (h * 31 + c.charCodeAt(0)) % PALETA.length;
  return PALETA[Math.abs(h) % PALETA.length];
}
function avatarHtml(marca, mini){
  const url = logosMap[slug(marca)];
  const claseExtra = mini ? " avatar-mini" : "";
  if (url) return `<div class="avatar${claseExtra}"><img src="${escaparHtml(url)}"></div>`;
  return `<div class="avatar${claseExtra}" style="background:${colorFor(marca)}">${escaparHtml(iniciales(marca))}</div>`;
}
function escaparHtml(t){ const d=document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; }

function telefonosFlat(){
  const lista = [];
  grupos.forEach((g, gi) => (g.telefonos||[]).forEach(t => lista.push({ marca:t.marca, modelo:t.modelo, grupo:g, grupoIndex:gi })));
  return lista;
}
function marcasUnicas(){
  const vistas = new Map();
  telefonosFlat().forEach(t => { const k=t.marca.toLowerCase(); if(!vistas.has(k)) vistas.set(k, t.marca); });
  return [...vistas.values()].sort((a,b)=>a.localeCompare(b));
}
function grupoDe(marca, modelo){
  return grupos.find(g => (g.telefonos||[]).some(t => t.marca===marca && t.modelo===modelo));
}
function etiquetaGrupo(grupo){
  const idx = grupos.findIndex(g => g.id === grupo.id);
  return "GRUPO #" + String(idx+1).padStart(3,"0");
}
function favKey(marca,modelo){ return marca+"||"+modelo; }
function toggleFavorito(marca,modelo){
  const k = favKey(marca,modelo);
  if (favoritos.has(k)) favoritos.delete(k); else favoritos.add(k);
  localStorage.setItem("favoritosCovers", JSON.stringify([...favoritos]));
  render();
}

// ---------- sesión ----------
async function iniciarSesion(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPass").value;
  document.getElementById("loginError").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) document.getElementById("loginError").textContent = "No se pudo iniciar sesión: " + error.message;
}
async function cerrarSesion(){ await sb.auth.signOut(); }

sb.auth.onAuthStateChange((_e, sesion) => {
  if (sesion){
    document.getElementById("pantallaLogin").classList.add("oculto");
    document.getElementById("app").classList.remove("oculto");
    cargarTodo();
  } else {
    document.getElementById("pantallaLogin").classList.remove("oculto");
    document.getElementById("app").classList.add("oculto");
  }
});

async function cargarTodo(){
  await Promise.all([cargarGrupos(), cargarLogos()]);
  suscribirRealtime();
  render();
}

async function cargarGrupos(){
  const { data, error } = await sb.from("grupos_covers").select("*").order("creado_en", { ascending: true });
  if (!error) grupos = data;
}
async function cargarLogos(){
  const { data, error } = await sb.from("marca_logos").select("*");
  if (!error){ logosMap = {}; data.forEach(r => logosMap[r.marca_slug] = r.logo_url); }
}
let canal = null;
function suscribirRealtime(){
  if (canal) return;
  canal = sb.channel("cambios_covers")
    .on("postgres_changes", { event:"*", schema:"public", table:"grupos_covers" }, async ()=>{ await cargarGrupos(); render(); })
    .on("postgres_changes", { event:"*", schema:"public", table:"marca_logos" }, async ()=>{ await cargarLogos(); render(); })
    .subscribe();
}

// ---------- navegación ----------
function navegar(v, params){ navStack.push({ v, ...params }); render(); }
function volver(){ if (navStack.length>1){ navStack.pop(); render(); } }
function irTab(v){ navStack = [{ v }]; render(); }

const TITULOS = {
  home:"Compatibilidad de Covers", buscar:"Buscar modelo", tengoUnCover:"Tengo un cover para...",
  compat:"Compatibilidad", marcas:"Marcas", marcaDetalle:"", grupos:"Grupos", grupoDetalle:"Grupo de compatibilidad",
  favoritos:"Favoritos", config:"Configuración"
};

function render(){
  const actual = navStack[navStack.length-1];
  document.getElementById("btnVolver").classList.toggle("oculto", navStack.length<=1);
  document.getElementById("btnConfig").classList.toggle("oculto", actual.v!=="home");
  document.getElementById("tituloHeader").textContent = actual.v==="marcaDetalle" ? actual.marca : (TITULOS[actual.v]||"");
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("activo", b.dataset.tab===actual.v));
  document.getElementById("fabNuevo").classList.toggle("oculto", actual.v!=="grupos" && actual.v!=="home");

  const main = document.getElementById("main");
  main.innerHTML = "";
  const renderers = {
    home: renderHome, buscar: ()=>renderBuscar(actual), tengoUnCover: ()=>renderBuscar(actual),
    compat: ()=>renderCompat(actual.marca, actual.modelo), marcas: renderMarcas,
    marcaDetalle: ()=>renderMarcaDetalle(actual.marca), grupos: renderGrupos,
    grupoDetalle: ()=>renderGrupoDetalle(actual.id), favoritos: renderFavoritos, config: renderConfig
  };
  (renderers[actual.v]||renderHome)(main);
}

// ---------- HOME ----------
function renderHome(main){
  main.innerHTML = `
    <input type="text" placeholder="Buscar modelo..." oninput="navegarBusquedaDesdeHome(this.value)" />
    <div style="display:flex;gap:12px;margin-top:14px;">
      <button class="card-accion" onclick="navegar('tengoUnCover',{query:''})">
        <span class="icono">📲</span><strong>Tengo un cover</strong><span class="desc">¿Para qué modelos sirve?</span>
      </button>
      <button class="card-accion" onclick="irTab('marcas')">
        <span class="icono">🔎</span><strong>Buscar por marca</strong><span class="desc">Explora las compatibilidades</span>
      </button>
    </div>
    <h3 style="margin-top:22px;margin-bottom:8px;font-size:15px;">Marcas</h3>
    <div class="grid-marcas" id="gridMarcasHome"></div>
  `;
  const marcas = marcasUnicas();
  const grid = document.getElementById("gridMarcasHome");
  marcas.forEach(m=>{
    const b = document.createElement("button");
    b.className = "marca-item";
    b.innerHTML = avatarHtml(m,false) + `<span>${escaparHtml(m)}</span>`;
    b.onclick = ()=>navegar("marcaDetalle",{marca:m});
    grid.appendChild(b);
  });
}
function navegarBusquedaDesdeHome(valor){
  navStack.push({ v:"buscar", query: valor });
  render();
}

// ---------- BUSCAR / TENGO UN COVER ----------
function renderBuscar(actual){
  const main = document.getElementById("main");
  const esTengoUnCover = actual.v === "tengoUnCover";
  main.innerHTML = `
    <input type="text" id="inputBuscar" placeholder="Buscar modelo..." value="${escaparHtml(actual.query||"")}" />
    <div id="resultadosBuscar" style="margin-top:10px;"></div>
    <div class="consejo">Consejo: también puedes buscar por marca y luego seleccionar el modelo.</div>
  `;
  const input = document.getElementById("inputBuscar");
  input.oninput = ()=>{ actual.query = input.value; pintarResultados(input.value); };
  setTimeout(()=>input.focus(),50);
  pintarResultados(actual.query||"");

  function pintarResultados(q){
    const cont = document.getElementById("resultadosBuscar");
    const qq = q.trim().toLowerCase();
    const lista = telefonosFlat().filter(t => !qq || (t.marca+" "+t.modelo).toLowerCase().includes(qq));
    if (!qq){ cont.innerHTML=""; return; }
    if (lista.length===0){ cont.innerHTML = `<div class="vacio">No hay modelos que coincidan.</div>`; return; }
    cont.innerHTML = "";
    lista.forEach(t=>{
      const fila = document.createElement("div");
      fila.className = "fila";
      fila.style.cursor = "pointer";
      fila.innerHTML = `${avatarHtml(t.marca,false)}<div class="fila-info"><div class="fila-nombre">${escaparHtml(t.marca)} ${escaparHtml(t.modelo)}</div></div><span class="chevron">›</span>`;
      fila.onclick = ()=>navegar("compat",{marca:t.marca, modelo:t.modelo});
      cont.appendChild(fila);
    });
  }
}

// ---------- COMPATIBILIDAD (detalle de un modelo) ----------
function renderCompat(marca, modelo){
  const main = document.getElementById("main");
  const grupo = grupoDe(marca, modelo);
  const otros = grupo ? (grupo.telefonos||[]).filter(t=>!(t.marca===marca&&t.modelo===modelo)) : [];
  const esFav = favoritos.has(favKey(marca,modelo));

  main.innerHTML = `
    <div class="tarjeta" style="text-align:center;">
      <div style="display:flex;justify-content:center;margin-bottom:10px;">${avatarHtml(marca,false)}</div>
      <div class="tarjeta-titulo">${escaparHtml(marca)} ${escaparHtml(modelo)}</div>
      <button class="btn-texto" onclick="toggleFavorito('${escaparHtml(marca)}','${escaparHtml(modelo)}')" style="margin-top:8px;">
        ${esFav ? "♥ En favoritos" : "♡ Agregar a favoritos"}
      </button>
      <div style="margin-top:12px;">
        ${otros.length>0 ? `<span class="badge-verde">✓ Mismo cover</span>` : `<span class="badge-gris">Sin compatibilidades registradas</span>`}
      </div>
    </div>
  `;

  if (otros.length>0){
    const principal = otros[0];
    main.innerHTML += `
      <div class="tarjeta" style="text-align:center;">
        <div style="color:var(--texto-suave);font-size:13px;margin-bottom:8px;">También compatible con</div>
        <div style="display:flex;justify-content:center;margin-bottom:6px;">${avatarHtml(principal.marca,false)}</div>
        <div style="font-weight:700;">${escaparHtml(principal.marca)} ${escaparHtml(principal.modelo)}</div>
      </div>
    `;
    if (otros.length>0){
      main.innerHTML += `<h3 style="font-size:14px;margin:16px 0 6px;">Otros modelos compatibles</h3>`;
      const cont = document.createElement("div");
      cont.className = "tarjeta";
      otros.forEach(t=>{
        const fila = document.createElement("div");
        fila.className = "fila";
        fila.style.cursor = "pointer";
        fila.innerHTML = `<span style="color:var(--verde);">✓</span><div class="fila-info"><div class="fila-nombre">${escaparHtml(t.marca)} ${escaparHtml(t.modelo)}</div></div><span class="chevron">›</span>`;
        fila.onclick = ()=>navegar("compat",{marca:t.marca, modelo:t.modelo});
        cont.appendChild(fila);
      });
      main.appendChild(cont);
    }
  } else {
    main.innerHTML += `<div class="vacio">Este modelo todavía no tiene compatibilidades registradas.</div>`;
  }
  const btnAgregar = document.createElement("button");
  btnAgregar.className = "btn btn-linea";
  btnAgregar.style.width = "100%";
  btnAgregar.style.marginTop = "14px";
  btnAgregar.textContent = "+ Agregar modelo compatible con este";
  btnAgregar.onclick = ()=>abrirModalVincular({ marca, modelo });
  main.appendChild(btnAgregar);
}

// ---------- MARCAS ----------
function renderMarcas(main){
  main.innerHTML = `<input type="text" placeholder="Buscar marca..." oninput="filtrarMarcas(this.value)" /><div id="listaMarcas" style="margin-top:12px;" class="tarjeta"></div>`;
  pintarListaMarcas("");
}
function filtrarMarcas(q){ pintarListaMarcas(q); }
function pintarListaMarcas(q){
  const cont = document.getElementById("listaMarcas");
  const qq = q.trim().toLowerCase();
  const marcas = marcasUnicas().filter(m=>!qq || m.toLowerCase().includes(qq));
  cont.innerHTML = "";
  if (marcas.length===0){ cont.innerHTML = `<div class="vacio">No hay marcas que coincidan.</div>`; return; }
  marcas.forEach(m=>{
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.style.cursor = "pointer";
    fila.innerHTML = `${avatarHtml(m,false)}<div class="fila-info"><div class="fila-nombre">${escaparHtml(m)}</div></div><span class="chevron">›</span>`;
    fila.onclick = ()=>navegar("marcaDetalle",{marca:m});
    cont.appendChild(fila);
  });
}

// ---------- DETALLE DE MARCA ----------
function renderMarcaDetalle(marca){
  const main = document.getElementById("main");
  main.innerHTML = `
    <input type="text" id="inputBuscarMarca" placeholder="Buscar modelo..." />
    <div class="tabs-secundarias" style="margin-top:10px;">
      <button id="tabTodos" class="activo" onclick="setTabMarca('todos')">Todos</button>
      <button id="tabCompatibles" onclick="setTabMarca('compatibles')">Compatibles</button>
    </div>
    <div id="listaModelosMarca" class="tarjeta"></div>
  `;
  let tabActual = "todos";
  window.setTabMarca = (t)=>{ tabActual=t; document.getElementById("tabTodos").classList.toggle("activo",t==="todos"); document.getElementById("tabCompatibles").classList.toggle("activo",t==="compatibles"); pintar(document.getElementById("inputBuscarMarca").value); };
  document.getElementById("inputBuscarMarca").oninput = (e)=>pintar(e.target.value);
  pintar("");

  function pintar(q){
    const qq = q.trim().toLowerCase();
    let modelos = telefonosFlat().filter(t=>t.marca===marca);
    if (qq) modelos = modelos.filter(t=>t.modelo.toLowerCase().includes(qq));
    if (tabActual==="compatibles") modelos = modelos.filter(t=> (t.grupo.telefonos||[]).length>1);
    const cont = document.getElementById("listaModelosMarca");
    cont.innerHTML = "";
    if (modelos.length===0){ cont.innerHTML = `<div class="vacio">No hay modelos que coincidan.</div>`; return; }
    modelos.forEach(t=>{
      const compatibles = (t.grupo.telefonos||[]).filter(x=>!(x.marca===t.marca&&x.modelo===t.modelo));
      const fila = document.createElement("div");
      fila.className = "fila";
      fila.style.cursor="pointer";
      fila.innerHTML = `
        <div class="fila-info">
          <div class="fila-nombre">${escaparHtml(t.modelo)}</div>
          <div class="fila-code">${compatibles.length>0 ? "Compatible con: "+compatibles.map(c=>escaparHtml(c.marca+" "+c.modelo)).join(", ") : "Sin compatibilidades"}</div>
        </div>
        <span class="badge-gris">${compatibles.length} modelo${compatibles.length===1?"":"s"}</span>`;
      fila.onclick = ()=>navegar("compat",{marca:t.marca, modelo:t.modelo});
      cont.appendChild(fila);
    });
  }
}

// Refresca los datos y vuelve a pintar la pantalla actual de inmediato,
// sin depender de que llegue el aviso de Realtime.
async function refrescarYRepintar(){
  await cargarGrupos();
  render();
}

// Marca dos teléfonos como compatibles. Si alguno ya pertenece a un grupo,
// se agrega ahí; si los dos ya tienen grupos distintos, se fusionan en uno solo.
async function marcarCompatibles(a, b){
  if (a.marca===b.marca && a.modelo===b.modelo){ alert("Son el mismo modelo."); return; }
  const gA = grupoDe(a.marca, a.modelo);
  const gB = grupoDe(b.marca, b.modelo);

  if (gA && gB && gA.id===gB.id){ alert("Esos modelos ya están vinculados."); return; }

  if (gA && gB){
    const combinados = [...gA.telefonos];
    gB.telefonos.forEach(t=>{ if(!combinados.some(x=>x.marca===t.marca&&x.modelo===t.modelo)) combinados.push(t); });
    const { error: e1 } = await sb.from("grupos_covers").update({ telefonos: combinados, nota: gA.nota || gB.nota || "" }).eq("id", gA.id);
    if (e1){ alert("No se pudo fusionar: " + e1.message); return; }
    const { error: e2 } = await sb.from("grupos_covers").delete().eq("id", gB.id);
    if (e2){ alert("No se pudo terminar la fusión: " + e2.message); return; }
  } else if (gA){
    const combinados = [...gA.telefonos];
    if (!combinados.some(x=>x.marca===b.marca&&x.modelo===b.modelo)) combinados.push(b);
    const { error } = await sb.from("grupos_covers").update({ telefonos: combinados }).eq("id", gA.id);
    if (error){ alert("No se pudo guardar: " + error.message); return; }
  } else if (gB){
    const combinados = [...gB.telefonos];
    if (!combinados.some(x=>x.marca===a.marca&&x.modelo===a.modelo)) combinados.push(a);
    const { error } = await sb.from("grupos_covers").update({ telefonos: combinados }).eq("id", gB.id);
    if (error){ alert("No se pudo guardar: " + error.message); return; }
  } else {
    const { error } = await sb.from("grupos_covers").insert({ telefonos: [a,b], nota: "" });
    if (error){ alert("No se pudo crear: " + error.message); return; }
  }
  await refrescarYRepintar();
}

async function agregarModeloAGrupoExistente(grupoId){
  const marca = leerMarcaSeleccionada("marcaAgregarGrupo");
  const modelo = document.getElementById("modeloAgregarGrupo").value.trim();
  if (!marca || !modelo) return;
  const g = grupos.find(x=>x.id===grupoId);
  const referencia = (g.telefonos||[])[0];
  await marcarCompatibles(referencia, { marca, modelo });
}
async function quitarTelefonoDeGrupo(grupoId, telefono){
  const g = grupos.find(x=>x.id===grupoId);
  const nuevos = (g.telefonos||[]).filter(t=>!(t.marca===telefono.marca && t.modelo===telefono.modelo));
  if (nuevos.length===0){ await eliminarGrupo(grupoId); return; }
  const { error } = await sb.from("grupos_covers").update({ telefonos: nuevos }).eq("id", grupoId);
  if (error){ alert("No se pudo guardar: " + error.message); return; }
  await refrescarYRepintar();
}
async function eliminarGrupo(id){
  if (!confirm("¿Eliminar este grupo por completo?")) return;
  const { error } = await sb.from("grupos_covers").delete().eq("id", id);
  if (error){ alert("No se pudo eliminar: " + error.message); return; }
  await cargarGrupos();
  volver();
}

// ---------- SELECTS DE MARCA (nativos, con opción "otra marca") ----------
function poblarSelectsMarca(){
  const marcas = marcasUnicas();
  document.querySelectorAll("select.select-marca").forEach(sel=>{
    const actual = sel.value;
    sel.innerHTML = `<option value="">Selecciona una marca</option>` +
      marcas.map(m=>`<option value="${escaparHtml(m)}">${escaparHtml(m)}</option>`).join("") +
      `<option value="__nueva__">+ Otra marca (escribir)</option>`;
    if (marcas.includes(actual)) sel.value = actual;
    onCambioMarca(sel.id);
  });
}
function onCambioMarca(idBase){
  const sel = document.getElementById(idBase);
  const nueva = document.getElementById(idBase+"_nueva");
  if (!sel || !nueva) return;
  if (sel.value === "__nueva__"){ nueva.classList.remove("oculto"); nueva.focus(); }
  else { nueva.classList.add("oculto"); }
}
function leerMarcaSeleccionada(idBase){
  const sel = document.getElementById(idBase);
  if (sel.value === "__nueva__") return document.getElementById(idBase+"_nueva").value.trim();
  return sel.value;
}

// ---------- VINCULAR MODELOS (modal) ----------
let vincularModeloAFijo = null; // si viene desde la pantalla de Compatibilidad, ya sabemos el modelo A

function abrirModalVincular(modeloAFijo){
  vincularModeloAFijo = modeloAFijo || null;
  document.getElementById("vincularModeloB").value = "";
  document.getElementById("vincularMarcaB_nueva").value = "";
  const bloqueA = document.getElementById("bloqueModeloA");
  if (vincularModeloAFijo){
    bloqueA.classList.add("oculto");
    document.getElementById("tituloModalVincular").textContent =
      "¿Qué modelo es igual a " + vincularModeloAFijo.marca + " " + vincularModeloAFijo.modelo + "?";
  } else {
    bloqueA.classList.remove("oculto");
    document.getElementById("vincularModeloA").value = "";
    document.getElementById("vincularMarcaA_nueva").value = "";
    document.getElementById("tituloModalVincular").textContent = "Vincular modelos compatibles";
  }
  poblarSelectsMarca();
  document.getElementById("modalNuevo").classList.remove("oculto");
}
function cerrarModalVincular(){ document.getElementById("modalNuevo").classList.add("oculto"); }

async function confirmarVincular(){
  const a = vincularModeloAFijo || {
    marca: leerMarcaSeleccionada("vincularMarcaA"),
    modelo: document.getElementById("vincularModeloA").value.trim()
  };
  const b = {
    marca: leerMarcaSeleccionada("vincularMarcaB"),
    modelo: document.getElementById("vincularModeloB").value.trim()
  };
  if (!a.marca || !a.modelo || !b.marca || !b.modelo){ alert("Completa marca y modelo de ambos."); return; }
  await marcarCompatibles(a, b);
  cerrarModalVincular();
}

    <p style="font-size:13px;color:var(--texto-suave);margin-bottom:10px;">

    </p>

    <button class="btn-peligro" style="margin-top:24px;" onclick="cerrarSesion()">Cerrar sesión</button>
  `;

    `;

      if (f) subirLogo(m, f);
    };

async function subirLogo(marca, archivo){
  const s = slug(marca);
  const ext = (archivo.name.split(".").pop() || "png").toLowerCase();
  const ruta = `${s}.${ext}`;
  const { error: errSubida } = await sb.storage.from("logos").upload(ruta, archivo, { upsert: true, contentType: archivo.type });
  if (errSubida){ alert("No se pudo subir el logo: " + errSubida.message); return; }
  const { data } = sb.storage.from("logos").getPublicUrl(ruta);
  const urlPublica = data.publicUrl + "?t=" + Date.now();
  const { error: errTabla } = await sb.from("marca_logos").upsert({ marca_slug: s, logo_url: urlPublica });
  if (errTabla){ alert("Se subió el logo pero no se pudo guardar el enlace: " + errTabla.message); return; }
  logosMap[s] = urlPublica;
  render();
}
